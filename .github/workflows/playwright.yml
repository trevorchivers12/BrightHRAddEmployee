# Runs the Playwright UI tests against the BrightHR sandbox.
#
# Before this workflow will log in successfully:
#   1. In GitHub, go to Settings > Secrets and variables > Actions > New repository secret
#      and add:
#        BRIGHTHR_USERNAME - the sandbox login email
#        BRIGHTHR_PASSWORD - the sandbox login password
#   2. Update tests/Page Objects/LoginPage.ts to read the credentials from
#      process.env.BRIGHTHR_USERNAME and process.env.BRIGHTHR_PASSWORD
#      instead of the hard-coded values.
#
# The HTML report, traces, screenshots and videos are uploaded as the
# "playwright-report" artifact on every run (open the run summary to download).

name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        env:
          CI: true
          BRIGHTHR_USERNAME: ${{ secrets.BRIGHTHR_USERNAME }}
          BRIGHTHR_PASSWORD: ${{ secrets.BRIGHTHR_PASSWORD }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
